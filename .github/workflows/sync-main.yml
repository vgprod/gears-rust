name: Sync main from upstream
on:
  schedule:
    - cron: "7 5 * * *"   # daily 05:07 UTC = 06:07 CET / 07:07 CEST
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync "$GITHUB_REPOSITORY" --branch main --force
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
